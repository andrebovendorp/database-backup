name: Build and Deploy Database Backup System

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/database-backup
  EXECUTABLE_NAME: database-backup

jobs:
  version:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - name: Checkout repository and tags
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Calculate and push version tag
      id: version
      env:
        BUMP: ${{ inputs.bump || 'patch' }}
      run: |
        set -euo pipefail

        for attempt in 1 2 3 4 5; do
          git fetch --force --tags origin
          latest_version=$(git tag --list | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          latest_version=${latest_version:-1.0.0}
          IFS=. read -r major minor patch <<< "$latest_version"

          case "$BUMP" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
            *) echo "Unsupported version bump: $BUMP" >&2; exit 1 ;;
          esac

          tag="v${major}.${minor}.${patch}"
          if git push origin "$tag"; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Could not push $tag; refreshing tags and retrying ($attempt/5)."
          sleep 2
        done

        echo "Failed to create a version tag after 5 attempts." >&2
        exit 1

  build-executable:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nuitka

    - name: Build executable with Nuitka
      run: |
        python -m nuitka \
          --onefile \
          --standalone \
          --output-filename=${{ env.EXECUTABLE_NAME }} \
          --include-data-files=config.yaml.example=config.yaml.example \
          --include-data-files=env.example=env.example \
          --assume-yes-for-downloads \
          main.py

    - name: Upload executable artifact
      uses: actions/upload-artifact@v7
      with:
        name: database-backup-${{ matrix.os }}
        path: ${{ env.EXECUTABLE_NAME }}.dist/${{ env.EXECUTABLE_NAME }}
        retention-days: 30

  build-docker:
    runs-on: ubuntu-latest
    needs: [build-executable, version]
    if: always() && needs.build-executable.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped')
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=${{ needs.version.outputs.tag }},enable=${{ needs.version.outputs.tag != '' }}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [build-executable, build-docker, version]
    if: always() && needs.build-executable.result == 'success' && needs.build-docker.result == 'success' && ((needs.version.result == 'success' && needs.version.outputs.tag != '') || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          artifacts/database-backup-ubuntu-latest/*
          artifacts/database-backup-windows-latest/*
          artifacts/database-backup-macos-latest/*
        tag_name: ${{ needs.version.outputs.tag || github.ref_name }}
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
